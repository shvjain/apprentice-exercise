name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t apprentice-exercise .
      - run: docker run -d -p 80:3000 apprentice-exercise
      - uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91
      - name: Check response is minified JSON
        run: |
          raw=$(curl -sf http://localhost:80/)
          echo "$raw"
          min=$(echo "$raw" | jq -c .)
          [ -n "$raw" ]
          [ "$raw" = "$min" ]
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Tag and push versioned image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TAG="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          docker tag apprentice-exercise "$DOCKERHUB_USERNAME/apprentice-exercise:$TAG"
          docker push "$DOCKERHUB_USERNAME/apprentice-exercise:$TAG"
